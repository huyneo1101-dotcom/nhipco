<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d2b22" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" />
<link rel="apple-touch-icon" href="./icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CueZen" />
<title>CueZen — bạn đồng hành khi đứng bàn bi-a</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0a241c; --bg2:#0d2b22; --card:#103a2e; --card2:#0e3328;
  --line:#1d5743; --text:#eafff5; --muted:#8fc7b2; --soft:#bfe9d6;
  --gold:#f4c95d; --on-gold:#1a1206; --accent:#34d399; --accent2:#10b981;
  --warn:#fbbf24; --danger:#f87171; --ok:#34d399;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:18px;
}
body.theme-midnight{
  --bg:#0b1020; --bg2:#0e1530; --card:#161f3d; --card2:#131b35;
  --line:#293561; --text:#eaf0ff; --muted:#93a0cf; --soft:#c3cdf2;
  --gold:#9db4ff; --on-gold:#0b1020; --accent:#7c9bff; --accent2:#5d7cf0;
}
body.theme-coffee{
  --bg:#1b120c; --bg2:#231811; --card:#33241a; --card2:#2c2016;
  --line:#5a4230; --text:#fbeede; --muted:#c8a98a; --soft:#e7d2b8;
  --gold:#e6a44e; --on-gold:#241405; --accent:#e0995a; --accent2:#c97f3e;
}
body.theme-court{ /* light */
  --bg:#eef4f0; --bg2:#e3ede8; --card:#ffffff; --card2:#f4f8f6;
  --line:#d4e3da; --text:#11302a; --muted:#5b7a70; --soft:#23463d;
  --gold:#0f9d6b; --on-gold:#ffffff; --accent:#10b981; --accent2:#059669;
  --shadow:0 8px 24px rgba(16,60,48,.12);
}
body.theme-racing{
  --bg:#161311; --bg2:#1d1815; --card:#241d1a; --card2:#1f1815;
  --line:#3d322d; --text:#fbeeea; --muted:#c4a99f; --soft:#e6cfc6;
  --gold:#ff8a5b; --on-gold:#161311; --accent:#e2483c; --accent2:#c43a30;
}
body.theme-neon{
  --bg:#0c1408; --bg2:#111c0b; --card:#15210f; --card2:#111a0c;
  --line:#2a3d1c; --text:#eafce0; --muted:#9fc488; --soft:#c9e6b4;
  --gold:#b6ff5a; --on-gold:#0c1408; --accent:#7ddb3a; --accent2:#5fb82a;
}
body.theme-peach{ /* light */
  --bg:#fff1ea; --bg2:#ffe6db; --card:#ffffff; --card2:#fff7f3;
  --line:#f6d8c8; --text:#4a2a1c; --muted:#9c7261; --soft:#6b4434;
  --gold:#e2733e; --on-gold:#ffffff; --accent:#f08a5a; --accent2:#d96a38;
  --shadow:0 8px 24px rgba(120,60,30,.12);
}
body.theme-sage{ /* light */
  --bg:#eef6ee; --bg2:#e3efe2; --card:#ffffff; --card2:#f4f9f3;
  --line:#d8e8d6; --text:#1d3a22; --muted:#5e7d61; --soft:#2e5234;
  --gold:#4f9d52; --on-gold:#ffffff; --accent:#5fb56a; --accent2:#469a51;
  --shadow:0 8px 24px rgba(30,70,40,.12);
}
body.theme-periwinkle{ /* light */
  --bg:#eef0fc; --bg2:#e3e6f7; --card:#ffffff; --card2:#f5f6fd;
  --line:#dadff5; --text:#232a4a; --muted:#6670a0; --soft:#353e6b;
  --gold:#4f5fd6; --on-gold:#ffffff; --accent:#6b7bf0; --accent2:#4f5fd6;
  --shadow:0 8px 24px rgba(40,50,120,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Cỡ chữ nền — mọi cỡ chữ trong app viết bằng rem nên đổi số này là đổi cả app.
   Người dùng chọn ở Cài đặt > Cỡ chữ; applyFontSize() ghi thẳng vào thuộc tính style
   của <html>, KHÔNG dùng class trên body vì applyTheme() ghi đè body.className. */
html{font-size:16px}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 90% at 50% -10%,var(--bg2),var(--bg));
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
#root{min-height:100%;display:flex;flex-direction:column}
.app{max-width:520px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 0 0}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--gold),#d8a83b);color:var(--on-gold);
  font-weight:900;font-size:1.125rem;box-shadow:var(--shadow)}
.brand b{font-size:1.125rem;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:0.6875rem;font-weight:600;margin-top:1px}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--text);
  width:40px;height:40px;border-radius:12px;font-size:1.125rem;cursor:pointer;display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}

.notifwrap{position:relative}
.notifbadge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;
  background:var(--danger);color:#fff;font-size:0.625rem;font-weight:800;display:grid;place-items:center;line-height:1;box-shadow:var(--shadow)}
.notifbackdrop{position:fixed;inset:0;z-index:45;background:transparent}
.notifpanel{position:absolute;top:48px;right:0;z-index:46;width:282px;max-width:78vw;
  background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:4px}
.notifhead{font-weight:800;font-size:0.78125rem;color:var(--muted);padding:4px 6px 2px;text-transform:uppercase;letter-spacing:.4px}
.notifempty{padding:10px 8px;font-size:0.8125rem;color:var(--text);line-height:1.4}
.notifitem{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px;font-size:0.8125rem;font-weight:600;color:var(--text);cursor:pointer}
.notifitem:active{transform:scale(.98)}

.body{flex:1;padding:6px 16px 14px;display:flex;flex-direction:column}

/* Thanh tab dưới CHIA ĐỀU, không cuộn ngang (HO-SO-THIET-KE.md mục 7b). 05 tab × tối thiểu
   60px vừa khít màn 390px; thêm tab thứ 06 thì phải bớt tab khác chứ không được lặng lẽ đẩy
   tab cuối ra ngoài mép — thanh dưới mà cuộn được là thanh dưới có mục không ai thấy. */
.tabs{display:flex;gap:5px;padding:8px 8px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--bg) 72%,transparent);position:sticky;bottom:0}
.tab{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--card2);color:var(--muted);
  border-radius:12px;padding:8px 7px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:0.625rem;font-weight:700;transition:.15s;white-space:nowrap}
.tab .ico{font-size:1.125rem;line-height:1}
.tab.on{background:linear-gradient(160deg,var(--card),var(--card2));color:var(--text);
  border-color:var(--gold);box-shadow:var(--shadow)}
.tab.on .ico{filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.tab:active{transform:scale(.96)}
.resetBtn{border:none;border-radius:11px;padding:9px 12px;font-size:0.8125rem;font-weight:800;cursor:pointer;
  background:linear-gradient(160deg,var(--accent),var(--accent2));color:#04231a;white-space:nowrap}
.resetBtn:active{transform:scale(.95)}
.reorder{display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:11px;background:var(--card2)}
.rico{font-size:1.0625rem;width:22px;text-align:center}
.rlab{flex:1;font-weight:700;font-size:0.875rem}
.rbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:0.9375rem;font-weight:800;cursor:pointer}
.rbtn:disabled{opacity:.3}
.musicgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.musicCard{display:flex;flex-direction:column;gap:2px;padding:14px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(165deg,var(--card),var(--card2));text-decoration:none;color:var(--text)}
.musicCard b{font-size:0.9375rem;font-weight:800;margin-top:4px}
.musicCard small{color:var(--muted);font-size:0.71875rem;font-weight:600}
.musicCard:active{transform:scale(.97)}
.resetLine{font-size:1.25rem;font-weight:800;text-align:center;max-width:88%;line-height:1.45;color:var(--soft)}
.mbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.mbar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.musicRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.musicLink{flex:1;min-width:0;color:var(--text);text-decoration:none;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{background:transparent;border:none;color:var(--danger);font-size:1.125rem;cursor:pointer;padding:2px 6px;flex:none}
.archbtn{border:none;background:transparent;color:var(--muted);padding:6px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:0;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s}
.archbtn:hover{color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent)}
.archbtn:active{transform:scale(.88)}
.archbtn svg{width:18px;height:18px;display:block}
.archbtn.on{color:var(--gold)}
.kacts{display:flex;align-items:center;gap:1px;flex:none}
.rnnum{width:21px;height:21px;border-radius:50%;background:var(--gold);color:var(--on-gold);font-weight:800;font-size:0.75rem;display:flex;align-items:center;justify-content:center;flex:none}
.rnstep{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:6px;cursor:pointer}
.rnstep.on{border-color:var(--gold)}
.poslegend{display:flex;gap:14px;justify-content:center;font-size:0.75rem;font-weight:700;color:var(--muted);margin:8px 0;flex-wrap:wrap}
.posdot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.35)}

.card{background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow)}
.h{font-size:0.8125rem;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.8px}
.muted{color:var(--muted)}
.btn{border:none;border-radius:14px;padding:13px 16px;font-size:0.9375rem;font-weight:800;cursor:pointer;
  background:linear-gradient(160deg,var(--gold),#dca93c);color:var(--on-gold)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.acc{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#04231a}
.btn:active{transform:scale(.97)}
.btn.wide{width:100%}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--soft);border-radius:999px;
  padding:7px 13px;font-weight:700;font-size:0.8125rem;cursor:pointer}
.chip.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}

/* ----- Metronome / shared ----- */
.metro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:0}
.pendwrap{width:200px;height:200px;position:relative;flex:none}
.pend{position:absolute;bottom:16px;left:50%;margin-left:-3px;transform-origin:bottom center}
.arm{width:6px;height:150px;background:linear-gradient(var(--accent),var(--accent2));border-radius:6px}
.bob{width:32px;height:32px;border-radius:50%;background:var(--gold);position:absolute;top:-14px;left:50%;
  transform:translateX(-50%);box-shadow:0 0 22px -4px var(--gold)}
.pivot{position:absolute;bottom:10px;left:50%;width:18px;height:18px;border-radius:50%;background:var(--accent);
  transform:translateX(-50%);box-shadow:0 0 16px -2px var(--accent)}
.bpmbox{display:flex;align-items:center;gap:18px}
.bpmbox button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:1.625rem;font-weight:800;cursor:pointer}
.bpmbox button:active{transform:scale(.92)}
.bpmnum{text-align:center;min-width:90px}
.bpmnum b{font-size:2.875rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.bpmnum small{display:block;color:var(--muted);font-weight:700;font-size:0.75rem;letter-spacing:1px;margin-top:2px}
.metro input[type=range]{width:100%;max-width:320px;accent-color:var(--gold)}
.clockbtns{display:flex;gap:10px;width:100%;max-width:330px}
.clockbtns .btn{flex:1}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* ⛔ CẤM cuộn ngang (Huy chốt 15/08/2026, HO-SO-THIET-KE.md mục 7b): nhãn dài như
   «🎯 Đầu cơ→Đường bi» làm thanh cần 390px trong khung 356px, tức nút thứ hai bị khuất.
   Nay XUỐNG DÒNG — nút lẻ cuối giãn hết hàng cho khỏi hụt một bên. */
.modeseg{display:flex;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.modeseg button{flex:1 1 auto;border:none;background:transparent;color:var(--muted);font-weight:800;font-size:0.8125rem;
  padding:7px 14px;border-radius:9px;cursor:pointer}
.modeseg button.on{background:var(--gold);color:var(--on-gold)}

/* ----- Breathing ----- */
.breathe{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.orb{width:min(70vw,260px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,var(--accent),var(--accent2));
  color:#04231a;box-shadow:0 0 60px -10px var(--accent);transition:transform 1s linear,background .4s}
.orb .ph{font-size:1.375rem;font-weight:900;text-align:center}
.orb .ct{font-size:2.875rem;font-weight:900;font-variant-numeric:tabular-nums}
.breathe .sub{color:var(--muted);text-align:center;max-width:300px;font-size:0.875rem;line-height:1.5}

/* ----- Routine ----- */
.steps{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.step{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);
  border-radius:14px;background:var(--card2);cursor:pointer;transition:.15s}
.step .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:900;
  background:var(--card);border:1px solid var(--line);color:var(--muted);flex:none;font-size:0.875rem}
.step .tx{flex:1;font-weight:700}
.step .tx small{display:block;color:var(--muted);font-weight:600;font-size:0.75rem;margin-top:2px}
.step.done{border-color:var(--accent);background:linear-gradient(160deg,var(--card),var(--card2))}
.step.done .n{background:var(--accent);color:#04231a;border-color:var(--accent)}
.step.done .tx{text-decoration:line-through;opacity:.65}
.step.cur{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent)}
.step.cur .n{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.rowbtns{display:flex;gap:10px;margin-top:14px}
.rowbtns .btn{flex:1}

/* ----- Cue cards ----- */
.cue{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.cuecard{width:100%;min-height:220px;padding:28px 24px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;cursor:pointer}
.cuecard .q{font-size:2.5rem}
.cuecard .t{font-size:1.3125rem;font-weight:800;line-height:1.45}
.cuecard .tag{font-size:0.6875rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.cuecard .csrc{font-size:0.6875rem;font-weight:600;color:var(--muted);line-height:1.4;max-width:92%}

/* Thanh lưu quote — hiện khi bôi đen một đoạn trong bài Kiến thức.
   ĐẶT Ở ĐỈNH màn hình, không đặt ở đáy: đáy điện thoại Android là chỗ hệ điều hành dựng
   thanh "Nhấn để xem kết quả tìm kiếm" cùng ba nút điều hướng, đè kín nút Lưu. */
.quotebar{position:fixed;left:0;right:0;top:0;z-index:55;margin:0 auto;width:100%;max-width:520px;
  background:linear-gradient(195deg,var(--card),var(--card2));border:1px solid var(--gold);
  border-radius:0 0 16px 16px;box-shadow:0 8px 30px rgba(0,0,0,.45);
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;flex-direction:column;gap:8px;
  animation:qbup .18s var(--ease)}
@keyframes qbup{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.quotebar .qnguon{font-size:0.6875rem;font-weight:800;letter-spacing:.6px;color:var(--gold);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quotebar .qtxt{font-size:0.8125rem;line-height:1.5;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quotebar .qacts{display:flex;gap:8px}
.quotebar .qbao{font-size:0.8125rem;font-weight:700;color:var(--ok);line-height:1.45}
.mqhero{position:relative;overflow:hidden;width:100%;min-height:clamp(240px,42vh,340px);padding:26px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;cursor:pointer;
  background:linear-gradient(160deg,var(--card),var(--card2));border:1.5px solid var(--gold);box-shadow:0 10px 34px -10px rgba(0,0,0,.55)}
.mqhero:active{transform:scale(.995)}
.mqhero::before{content:"⚔";position:absolute;right:-26px;bottom:-54px;font-size:13.75rem;line-height:1;opacity:.055;pointer-events:none}
.mqhero .mqlabel{font-size:0.75rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--gold);z-index:1}
.mqhero .mqtext{font-size:clamp(1.4375rem,6.3vw,2.0625rem);font-weight:900;line-height:1.28;letter-spacing:-.3px;color:var(--text);z-index:1}
.mqhero .mqhint{font-size:0.71875rem;color:var(--muted);letter-spacing:.4px;z-index:1}

/* ----- Lists / match journal + training ----- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding-bottom:6px}
.preline{white-space:pre-wrap}
.klink{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.mcard{padding:13px;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.mtop{display:flex;align-items:center;gap:10px}
.rbadge{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:900;
  font-size:0.875rem;flex:none}
.rbadge.W{background:var(--ok);color:#04231a} .rbadge.L{background:var(--danger);color:#3b0a0a}
.rbadge.D{background:var(--line);color:var(--text)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag2{font-size:0.71875rem;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card2);
  border:1px solid var(--line);color:var(--muted)}
.statstrip{display:flex;gap:8px;margin:12px 0 4px}
.stat{flex:1;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.stat b{display:block;font-size:1.3125rem;line-height:1.1} .stat small{color:var(--muted);font-size:0.6875rem;font-weight:700}
.small{font-size:0.75rem}
.h2{font-size:0.8125rem;font-weight:800;color:var(--gold);margin:18px 0 0;letter-spacing:.3px}
.drill{padding:14px;display:flex;flex-direction:column;gap:6px}

/* Dải chip danh mục cũng XUỐNG DÒNG. Lớp `.wrap` giữ lại để chỗ nào đang khai vẫn chạy,
   nay nó không còn khác gì mặc định. */
.catbar{display:flex;flex-wrap:wrap;gap:7px;padding:9px 0 3px}
.catbar.wrap{flex-wrap:wrap}
.catbar .chip{flex:none}
.drillC{padding:0;overflow:hidden;margin-top:0}
.drillH{display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer}
.drillH .dn{flex:1;min-width:0}
.drillH .dn b{font-weight:800;font-size:0.90625rem}
.drillH .dn small{display:block;color:var(--muted);font-size:0.71875rem;font-weight:600;margin-top:1px}
.drillH .sc{text-align:right;flex:none}
.drillH .sc b{font-size:1.0625rem;line-height:1;font-variant-numeric:tabular-nums}
.drillH .sc small{display:block;color:var(--muted);font-size:0.625rem;font-weight:700}

  letter-spacing:.4px;background:transparent;flex:none}
.drillB{padding:2px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.kv{font-size:0.8125rem;line-height:1.55}
.kv b{color:var(--soft);font-weight:800}
.statline{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:0.75rem;color:var(--muted);font-weight:700}
.statline b{color:var(--text)}
.oav{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:1.0625rem;
  background:var(--card2);border:1px solid var(--line);color:var(--gold);flex:none;text-transform:uppercase}
.hh{display:flex;gap:14px;align-items:center;font-size:0.8125rem;font-weight:800;margin-top:2px}
.hh .w{color:var(--ok)} .hh .l{color:var(--danger)} .hh .d{color:var(--muted)}
.chartcap{display:flex;justify-content:space-between;align-items:baseline;font-size:0.75rem;color:var(--muted);font-weight:700;margin-bottom:6px}
.chartcap b{color:var(--text);font-size:0.8125rem}
/* shot clock fullscreen */
.scOverlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:24px;text-align:center;transition:background .3s;user-select:none}
.scClose{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;width:42px;height:42px;
  border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--text);font-size:1.25rem;cursor:pointer}
.scStep{font-size:0.8125rem;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.scPhase{font-size:1.875rem;font-weight:900;line-height:1.15;max-width:90%}
.scSub{font-size:0.9375rem;color:var(--muted);font-weight:600;margin-top:-2px;max-width:88%}
.scNum{font-size:34vw;font-weight:900;line-height:.9;font-variant-numeric:tabular-nums;margin:6px 0}
.scBar{width:min(82vw,360px);height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.scHint{font-size:0.8125rem;color:var(--muted);font-weight:600}
@keyframes scpulse{0%,100%{opacity:1}50%{opacity:.35}}
.scNum.pulse{animation:scpulse .5s steps(1) infinite}
.mtable{width:100%;max-width:380px;align-self:center;border-radius:7px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.cueball{width:148px;height:148px;align-self:center;touch-action:none;cursor:pointer;margin-top:6px}
.dbspin-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ncspin{width:28px;height:28px;border:3px solid rgba(0,0,0,.18);border-top-color:var(--gold);border-radius:50%;animation:ncspin .8s linear infinite}
@keyframes ncspin{to{transform:rotate(360deg)}}
/* Bàn run-out: to nhất có thể, cách dòng trên/dưới; nút + overlay fullscreen */
.rnboardwrap{position:relative;margin:12px auto 14px;width:100%;max-width:min(96vw,560px)}
.rnboard{width:100%;display:block;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.32)}
.rnfull{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:8px;padding:2px 9px;font-size:1rem;cursor:pointer;line-height:1.2}
.rnfullov{position:fixed;inset:0;z-index:80;background:rgba(8,10,12,.93);display:flex;align-items:center;justify-content:flex-start;padding:12px 12px 12px 16px}
.rnfullinner{width:100%;max-width:min(calc(96vw - 250px),calc(92vh*1.667))}
.rnfulltable{width:100%;display:block;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.55)}
.rntipfs{position:absolute;right:calc(14px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:2;
  background:rgba(16,20,22,.86);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px 14px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;max-width:232px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.rntipfs .rntiplbl{font-size:0.78125rem;color:#eaf1ec;line-height:1.4;font-weight:800}
.rntipfs .rntiplbl small{color:#a2b5ac;font-weight:600}
.rncur{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-top:8px;border:1px solid var(--gold)}
.rncur .rncurinfo{flex:1;min-width:0;font-size:0.875rem;line-height:1.5}
.rncur .rncurhead{display:flex;align-items:center;gap:8px;font-size:0.90625rem}
.ghostform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:3px}
.dot.W{background:var(--ok)} .dot.L{background:var(--danger)}
.stepper{display:flex;align-items:center;gap:18px;justify-content:center;margin:8px 0 4px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:1.5rem;font-weight:800;cursor:pointer}
.stepper button:active{transform:scale(.92)}
.stepper .sv{font-size:2.625rem;font-weight:900;min-width:96px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.stepper .sv small{display:block;font-size:0.75rem;color:var(--muted);font-weight:700}

/* ----- Sheets / modal ----- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:40}
.sheet{width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);
  border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.4);max-height:82vh;overflow:auto}
.sheet h3{margin:2px 0 14px;font-size:1.0625rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:0.8125rem;font-weight:700;color:var(--soft)}
.field input,.field select,.field textarea{background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:11px;padding:11px 12px;font-size:0.9375rem;font-family:inherit}
.field textarea{resize:vertical;min-height:88px;line-height:1.5}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:12px;cursor:pointer;border:2px solid transparent;position:relative}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}

   cỡ nào to hơn cỡ nào; nhãn dưới để rem nên đổi theo chính cỡ đang chọn. */
.fsrow{display:flex;gap:8px}
.fsbtn{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--muted);cursor:pointer;
  transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease)}
.fsbtn .fsa{font-weight:900;line-height:1.1}
.fsbtn small{font-size:0.6875rem;font-weight:700}
.fsbtn.on{background:linear-gradient(160deg,var(--card),var(--card2));border-color:var(--gold);color:var(--text);box-shadow:var(--shadow)}
.fsbtn.on .fsa{color:var(--gold)}
.fsbtn:active{transform:scale(.96)}
@media(hover:hover){ .fsbtn:hover{border-color:var(--gold);color:var(--text)} }
.editrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
/* min-width:0 bắt buộc: ô nhập mặc định rộng theo 20 ký tự, ở cỡ chữ Lớn/Rất lớn
   thì bề rộng tối thiểu ấy đẩy cả hàng tràn ra ngoài màn hình. */
.editrow input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:9px 11px;font-size:0.875rem;font-family:inherit}
.editrow .x{background:transparent;border:none;color:var(--danger);font-size:1.25rem;cursor:pointer;padding:4px 6px}
.diag{position:fixed;inset:0;background:#0a241c;color:#eafff5;padding:30px;font-family:monospace;
  font-size:0.8125rem;z-index:99;display:none}

/* ===== Nâng cấp giao diện — đợt 6: nền tảng chuyển động ===== */
:root{ --r-sm:12px; --dur:.16s; --ease:cubic-bezier(.4,0,.2,1); }
.btn,.chip,.tab,.card,.step,.musicCard,.iconbtn,.rbtn,.stat,.mcard{
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),
    background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease);
}
.chip:active{transform:scale(.95)}
@media(hover:hover){
  .chip:hover{border-color:var(--gold);color:var(--text)}
  .btn:hover{filter:brightness(1.06)}
  .card:hover{border-color:color-mix(in srgb,var(--gold) 38%,var(--line))}
  .mcard:hover,.musicCard:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,0,0,.28)}
  .iconbtn:hover,.rbtn:hover:not(:disabled){border-color:var(--gold)}
}

/* ===== đợt 7: empty states ===== */
.empty{text-align:center;padding:44px 20px 30px;color:var(--muted);animation:emp .3s var(--ease)}
@keyframes emp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.empty-t{font-weight:800;font-size:1.03125rem;color:var(--soft);margin-bottom:6px}
.empty-s{font-size:0.8125rem;line-height:1.55;max-width:300px;margin:0 auto}

/* ===== đợt 8: chỉ số & thanh tiến độ ===== */
.stat{background:linear-gradient(160deg,var(--card),var(--card2))}
.stat b{font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.statstrip{gap:9px}
.mbar{background:color-mix(in srgb,var(--line) 65%,transparent)}
.mbar>div{transition:width .55s var(--ease)}
.tag2{transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease)}

/* ===== đợt 9: chip + nút đồng nhất ===== */
.modeseg button{transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.modeseg button.on{box-shadow:0 2px 8px color-mix(in srgb,var(--gold) 42%,transparent)}
.btn{letter-spacing:.2px}
.btn.ghost:active{transform:scale(.97)}
.chip.on{box-shadow:0 2px 8px color-mix(in srgb,var(--gold) 32%,transparent)}
@media(hover:hover){ .modeseg button:hover:not(.on){color:var(--text)} }

/* ===== đợt 10: thanh tab dưới ===== */
.tabs{gap:6px}
.tab .ico{transition:transform var(--dur) var(--ease)}
.tab.on{transform:translateY(-2px)}
.tab.on .ico{transform:scale(1.1)}
@media(hover:hover){ .tab:hover:not(.on){border-color:color-mix(in srgb,var(--gold) 40%,var(--line));color:var(--text)} }

/* ===== đợt 11: header + tiêu đề mục ===== */
.logo{box-shadow:0 4px 16px -2px color-mix(in srgb,var(--gold) 52%,transparent)}
.brand b{letter-spacing:.4px;font-size:1.1875rem}
.h2{font-size:0.84375rem;margin-top:20px}
.h{letter-spacing:.9px}
.tsub{max-width:520px}

/* ===== đợt 13: chuyển tab ===== */
.tabfade{flex:1;display:flex;flex-direction:column;min-height:0;animation:tabf .22s var(--ease)}
@keyframes tabf{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ===== đợt 15: hoàn thiện ===== */
.sheet{animation:sheetup .26s var(--ease)}
@keyframes sheetup{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.scrim{animation:scrimin .2s var(--ease)}
@keyframes scrimin{from{opacity:0}to{opacity:1}}
.catbar{gap:8px}
.empty-ic{transition:transform var(--dur) var(--ease)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
